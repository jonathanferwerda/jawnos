; PlatformIO project for the JawnOS alarm-clock firmware
; (alarmclock.ino, Raspberry Pi Pico 2 W / RP2350).
;
;   pio run                 build
;   pio run -t upload       flash over USB
;   pio device monitor      serial console
;
; The Arduino core is Earle F. Philhower's arduino-pico (via the community
; platform-raspberrypi platform). Everything the sketch pulls from the core
; ships with it: LittleFS, Servo, Wire, HTTPClient, WebServer, WiFi, PicoOTA,
; HTTPUpdate (the HTTPRaw upload type) and the WebServer UriRegex helper.
;
; The two libraries the core does not carry come from ~/jawnos-fw/pico-libs -
; the very same ones the arduino-cli build used (LiquidCrystal I2C 1.1.2,
; Arduino_JSON 0.2.0).
;
[platformio]
; the sketch lives here, not in src/
src_dir = .

[env:pico2w]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2w
framework = arduino

; OTA keeps the uploaded image in LittleFS, so the 4 MB flash has to be split.
; The default (0 MB filesystem) left the OTA image nowhere to live and booted a
; firmware with no config.txt, which is why an OTA dropped the device off the
; network. 2 MB sketch headroom + 2 MB filesystem fits the ~685 KB sketch with
; room for the OTA image and its config.
board_build.filesystem_size = 2M

build_src_filter =
	+<*.ino.cpp>
	-<build/>
	-<.pio/>

lib_extra_dirs = /home/jawn/jawnos-fw/pico-libs

; LiquidCrystal_I2C predates the RP2040 and only ships a thin library.properties;
; deep scanning resolves its Wire/LiquidCrystal chain the way arduino-cli did.
lib_ldf_mode = deep+

upload_protocol = picotool
monitor_speed = 115200
