# JawnOS on Sway -- a starting point. See desktop/wayland/README.md.
# Copy to ~/.config/sway/config, or start with:
#   sway -c ~/jawnos/desktop/wayland/sway.conf

set $mod Mod4
set $jawnos $HOME/jawnos

# --- the JawnOS session comes up first --------------------------------------
exec --no-startup-id $jawnos/desktop/wayland/jawnos-session
exec --no-startup-id swaybg -c '#2e3440'

# The bar is the shell now. jawnos-shell is a GTK3 layer-shell panel in the
# "top" layer with an exclusive zone, so tiled windows sit below it instead of
# underneath it. It replaces waybar; waybar.conf is kept only as a fallback.
exec --no-startup-id $jawnos/desktop/jawnos-shell

# The focus watcher turns what Sway knows about the focused window into the
# house's app-time rows. It rides the desktop app's own ticket, so it needs no
# separate credential.
exec --no-startup-id $jawnos/desktop/jawnos-usage

# An unfamiliar monitor can come up with no mode at all (a black screen). The
# script lives in the live image; skip the call on a tree that has not got it.
exec --no-startup-id sh -c '[ -x /usr/local/bin/jawnos-display ] && exec /usr/local/bin/jawnos-display --once'

# The manager is an ordinary window now. It used to be force-fullscreened here,
# which made the manager pretend to be the whole desktop; the session bar owns
# the screen edge instead. Sway tiles the manager like any other window. No
# floating/resize rule is set on purpose -- a tiled manager is the default; add
#   for_window [app_id="^jawnos-desktop$"] floating enable, resize set 1280 900
# only if a floating manager is wanted on a large monitor.

# Everything else floats, so it can be dragged around the desktop.
for_window [app_id="^(zed|dev\.zed\.Zed)$"] floating enable
for_window [app_id="^foot$"] floating enable, resize set 900 600
for_window [app_id="org\.gnome\.Nautilus"] floating enable

# Idle accounting: jawnos-usage records the focused app, and a lock screen is
# treated as non-app time. If this session should also lock when idle, start
# swayidle (it is not in the image yet -- see desktop/wayland/README.md):
# exec --no-startup-id swayidle -w timeout 300 'swaylock -f' timeout 600 'swaymsg "output * dpms off"' resume 'swaymsg "output * dpms on"'

# --- keys -------------------------------------------------------------------
bindsym $mod+Return exec foot
bindsym $mod+d exec fuzzel
bindsym $mod+q kill
bindsym $mod+f fullscreen toggle
bindsym $mod+Shift+r reload
# Cycle the focused monitor through the safe modes (1366x768, 1920x1080,
# 1280x720, 1024x768) and print the one it chose.
bindsym $mod+Shift+d exec /usr/local/bin/jawnos-display --cycle
bindsym $mod+Shift+e exec swaynag -t warning -m 'Leave Sway?' -B 'Yes, exit' 'swaymsg exit'
bindsym XF86AudioRaiseVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindsym XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# --- look -------------------------------------------------------------------
font pango:monospace 10
default_border pixel 2
floating_modifier $mod
