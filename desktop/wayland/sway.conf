# JawnOS on Sway -- a starting point. See desktop/wayland/README.md.
# Copy to ~/.config/sway/config, or start with:
#   sway -c ~/jawnos/desktop/wayland/sway.conf

set $mod Mod4
set $jawnos $HOME/jawnos

# --- the JawnOS session comes up first --------------------------------------
exec --no-startup-id $jawnos/desktop/wayland/jawnos-session
exec --no-startup-id swaybg -c '#0d0d12'
exec --no-startup-id waybar -c $jawnos/desktop/wayland/waybar.conf

# JawnOS owns the screen.
for_window [app_id="^jawnos-desktop$"] fullscreen enable

# Everything else floats, so it can be dragged around the JawnOS desktop.
for_window [app_id="^(zed|dev\.zed\.Zed)$"] floating enable
for_window [app_id="^foot$"] floating enable, resize set 900 600
for_window [app_id="org\.gnome\.Nautilus"] floating enable

# --- keys -------------------------------------------------------------------
bindsym $mod+Return exec foot
bindsym $mod+d exec fuzzel
bindsym $mod+q kill
bindsym $mod+f fullscreen toggle
bindsym $mod+Shift+r reload
bindsym $mod+Shift+e exec swaynag -t warning -m 'Leave Sway?' -B 'Yes, exit' 'swaymsg exit'
bindsym XF86AudioRaiseVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindsym XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# --- look -------------------------------------------------------------------
font pango:monospace 10
default_border pixel 2
floating_modifier $mod
