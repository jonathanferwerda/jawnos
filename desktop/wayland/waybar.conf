// JawnOS on Sway -- a minimal top bar with a taskbar. See README.md.
// Run with:  waybar -c desktop/wayland/waybar.conf
// The bar sits in the layer-shell "top" layer, so it draws over normal windows.
{
  "layer": "top",
  "position": "top",
  "height": 34,
  "spacing": 6,
  "modules-left": ["sway/workspaces", "sway/mode"],
  "modules-center": ["wlr/taskbar"],
  "modules-right": ["pulseaudio", "network", "clock"],

  // Every toplevel -- Zed included -- appears here.
  "wlr/taskbar": {
    "format": "{icon} {title:.24}",
    "icon-size": 18,
    "on-click": "activate",
    "on-click-middle": "close",
    "on-click-right": "minimize"
  },

  "clock": { "format": "{:%a %d %b  %H:%M}", "tooltip": false },
  "network": { "format-wifi": "{essid} {signalStrength}%", "format-ethernet": "wired", "format-disconnected": "offline" },
  "pulseaudio": { "format": "{icon} {volume}%", "format-muted": "muted", "format-icons": ["", "", ""] }
}
