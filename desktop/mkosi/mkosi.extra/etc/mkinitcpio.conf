# The image's initramfs hooks, with Plymouth in place of the bare console:
# the plymouth hook copies this machine's theme (jawnos) and its images into the
# initramfs, so the boot shows the JawnOS mark from the first moments instead of
# the kernel's initialization list. Arch's plymouth package calls this hook
# `plymouth`; the `sd-plymouth` name belongs to the Manjaro packaging. The rest is
# the set the image already used (systemd initramfs, kms for the panel/DRM
# device, sd-vconsole for the keymap).
#
# sd-encrypt is the systemd initramfs' LUKS hook. The live image has no
# rd.luks.* on its command line, so the hook is inert there; an installed disk
# (jawnos-install --encrypt) uses rd.luks.name=<uuid>=jawnos-root and needs it
# to unlock the root before it can be mounted.
MODULES=()
BINARIES=()
FILES=()
HOOKS=(base systemd plymouth autodetect microcode modconf kms keyboard sd-vconsole block sd-encrypt filesystems fsck)
