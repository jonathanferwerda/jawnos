# The image's initramfs hooks, with Plymouth in place of the bare console:
# sd-plymouth copies this machine's theme (jawnos) and its images into the
# initramfs, so the boot shows the JawnOS mark from the first moments instead of
# the kernel's initialization list. The rest is the set the image already used
# (systemd initramfs, kms for the panel/DRM device, sd-vconsole for the keymap).
MODULES=()
BINARIES=()
FILES=()
HOOKS=(base systemd sd-plymouth autodetect microcode modconf kms keyboard sd-vconsole block filesystems fsck)
