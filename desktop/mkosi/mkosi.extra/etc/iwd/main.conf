# iwd owns the wireless association; systemd-networkd owns the address.
#
# iwd's own network configuration (its built-in DHCP client) would race the
# 20-wireless.network lease, so leave that to networkd. The Network app drives
# iwctl for scan/connect/disconnect; once a network is joined, networkd asks
# for the address on the wl* interface.
[General]
EnableNetworkConfiguration=false
