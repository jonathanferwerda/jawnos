# The house: /home/jawn, which holds the checkout, config.json, the encrypted
# database, .president and every media location. Deliberately empty on a fresh
# image - the first boot seeds it from /opt/jawnos (see jawnos-firstboot) - so
# growing or reusing it never rewrites the system.
#
# The label ends in -img because this partition is the image's own state:
# Ventoy boots the raw image through a loop device, so this partition is then
# read-only. (ext4 labels are limited to 16 bytes, so `jawnos-state-image`
# cannot be written to the filesystem; jawnos-state-img is the full 16-byte
# spelling.) A Ventoy stick with reserved space carries a real partition
# labelled `jawnos-state`, and jawnos-state-mount prefers that one. A direct dd
# or QEMU boot has no such partition, so the house uses this one.
#
# This is the one partition that expands to fill the device: the installer
# creates it at the full target size, and /usr/local/bin/jawnos-grow grows it
# (and its ext4) on a live stick or a QEMU disk. GrowFileSystem=yes is not used
# because systemd-repart cannot grow a filesystem on a generic partition type;
# jawnos-grow runs resize2fs explicitly. The large Max is the cap, not the
# build size - mkosi builds at the sum of the Min sizes.
[Partition]
Type=linux-generic
Format=ext4
Label=jawnos-state-img
SizeMinBytes=2G
SizeMaxBytes=4000G
