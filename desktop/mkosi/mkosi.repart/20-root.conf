# The system: read-only at boot and overlaid in RAM (KernelCommandLine in
# mkosi.conf). Nothing of the house is stored here, so losing the root loses
# nothing a person made.
#
# Fixed at 6.5G on purpose. The root is not grown at install or first boot (a
# read-only overlay cannot grow its ext4 online), and a fixed size leaves every
# remaining byte to jawnos-state, which is where a person's data actually goes.
# 6.5G (was 5G) leaves roughly 2G free once the Qt/WebEngine set is installed;
# that set filled 4.4G of the old 5G root and left only ~491M. The ESP stays 1G
# and state keeps its 2G minimum, so the built image grows by 1.5G.
# GrowFileSystem=yes is deliberately absent: the root is fixed and read-only,
# so growth would only make systemd-growfs-root.service try to grow it on every
# boot and fail, leaving the boot degraded. The image also masks
# systemd-growfs-root.service (and the QEMU-only vconsole unit) in
# mkosi.extra/etc/systemd/system so a no-op grow cannot mark the boot degraded.
[Partition]
Type=root
Format=ext4
Label=jawnos-root
CopyFiles=/
SizeMinBytes=6.5G
SizeMaxBytes=6.5G
