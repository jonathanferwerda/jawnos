# The system: read-only at boot and overlaid in RAM (KernelCommandLine in
# mkosi.conf). Nothing of the house is stored here, so losing the root loses
# nothing a person made.
#
# Fixed at 5G on purpose. The root is not grown at install or first boot (a
# read-only overlay cannot grow its ext4 online), and a fixed size leaves every
# remaining byte to jawnos-state, which is where a person's data actually goes.
# GrowFileSystem=yes is deliberately absent: it made systemd-growfs-root.service
# try to grow the read-only root on every boot and fail, leaving the boot
# degraded. There is no free space to give this partition anyway. The image
# also masks systemd-growfs-root.service (and the QEMU-only vconsole unit) in
# mkosi.extra/etc/systemd/system so a no-op grow cannot mark the boot degraded.
[Partition]
Type=root
Format=ext4
Label=jawnos-root
CopyFiles=/
SizeMinBytes=5G
SizeMaxBytes=5G
