# The ESP: the unified kernel image is what the firmware boots. mkosi installs
# the EFI binaries under /efi in the image (the kernel and any loader entries
# live under /boot), so copy that tree, not /boot.
#
# Fixed at 1G: one UKI plus a boot entry fits with room to spare, and every
# byte the ESP does not take is a byte the state partition can use on a stick.
[Partition]
Type=esp
Format=vfat
Label=jawnos-esp
CopyFiles=/efi:/
SizeMinBytes=1G
SizeMaxBytes=1G
