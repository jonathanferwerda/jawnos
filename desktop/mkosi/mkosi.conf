# JawnOS as an image. Arch is the first backend; Debian is the second (see the
# README before using it).
#
#   perl scripts/mkosi_build.pl              # build the live image
#   perl scripts/mkosi_build.pl --dry-run    # show the command, build nothing
#
# The image is one artefact that serves as both the live USB and the installer:
# boot it, try JawnOS, and run `jawnos-install` to keep it.

[Config]
Profiles=live
Dependencies=

[Distribution]
Distribution=arch

[Output]
Format=disk
Bootable=yes
ImageId=jawnos
ImageVersion=0.1
OutputDirectory=output

[Content]
# The live root is read-only and every change lands in a RAM overlay, so a USB
# boot never rots. The house itself lives on the `jawnos-state` partition (see
# mkosi.repart/30-state.conf), which survives a reboot and is what the installer
# copies onto a disk.
KernelCommandLine=systemd.volatile=overlay
Packages=
    base
    base-devel
    systemd
    systemd-sysupdate
    systemd-ukify
    linux
    linux-firmware
    mkinitcpio
    sudo
    git
    perl
    cpanminus
    sqlite
    openssl
    curl
    rsync
    tmux
    less
    nano
    file
    which
    procps-ng
    iproute2
    net-tools
    autossh
    openssh
    sshpass
    argon2
    zip
    nodejs
    bluez
    bluez-utils
    pipewire
    wireplumber
    sway
    swaybg
    waybar
    foot
    fuzzel
    mako
    wl-clipboard
    grim
    slurp
    xdg-desktop-portal-wlr
    polkit
    mesa
    vulkan-intel
    intel-media-driver
    libva-utils
    webkit2gtk-4.1
    gst-plugins-base
    gst-plugins-good
    gst-plugins-bad
    gst-libav
    python
