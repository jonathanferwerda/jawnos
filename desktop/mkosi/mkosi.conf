# JawnOS as an image. Arch is the first backend; Debian is the second (see the
# README before using it).
#
#   perl scripts/mkosi_build.pl              # build the live image
#   perl scripts/mkosi_build.pl --dry-run    # show the command, build nothing
#
# The image is one artefact that serves as both the live USB and the installer:
# boot it, try JawnOS, and run `jawnos-install` to keep it.

[Config]
Profiles=live
Dependencies=

[Build]
# The post-install script fetches the Perl modules the app needs (there is no
# complete Arch package set for them), so the build needs the host network.
WithNetwork=yes

[Distribution]
Distribution=arch

[Output]
Format=disk
ImageId=jawnos
ImageVersion=0.1
OutputDirectory=output

[Content]
# The live root is read-only and every change lands in a RAM overlay, so a USB
# boot never rots. The house itself lives on the `jawnos-state` partition (see
# mkosi.repart/30-state.conf), which survives a reboot and is what the installer
# copies onto a disk.
Bootable=yes
# A single unified kernel image at EFI/BOOT/BOOTX64.EFI: the firmware's own
# fallback path, so the image boots in a VM or on a stick with no NVRAM entry
# and no separate systemd-boot menu to maintain.
Bootloader=uki
KernelCommandLine=systemd.volatile=overlay systemd.firstboot=no
Packages=
    base
    base-devel
    systemd
    systemd-ukify
    linux
    linux-firmware
    mkinitcpio
    sudo
    git
    perl
    cpanminus
    sqlite
    openssl
    curl
    rsync
    tmux
    less
    nano
    file
    which
    procps-ng
    iproute2
    net-tools
    inetutils
    autossh
    openssh
    sshpass
    argon2
    zip
    nodejs
    bluez
    bluez-utils
    pipewire
    wireplumber
    sway
    swaybg
    waybar
    foot
    fuzzel
    mako
    wl-clipboard
    grim
    slurp
    xdg-desktop-portal-wlr
    polkit
    mesa
    vulkan-intel
    intel-media-driver
    libva-utils
    webkit2gtk-4.1
    gst-plugins-base
    gst-plugins-good
    gst-plugins-bad
    gst-libav
    python
    python-gobject
    python-dbus
    ffmpeg
    imagemagick
    tesseract
    espeak-ng
    sox
    zbar
    qrencode
    dosfstools
    mtools
    e2fsprogs
    parted
    efibootmgr

[Runtime]
# mkosi's GUI default is SDL, which letterboxes the guest framebuffer and has no
# resize control. GTK with zoom-to-fit lets a person drag the VM window and keep
# the whole manager visible. The guest stays at its own resolution (virtio-vga
# EDID does not propagate a host-window drag), so the desktop is scaled to fit
# rather than reflowed; the app still repaints on a real output change.
QemuArgs=-display gtk,gl=on,zoom-to-fit=on
