# JawnOS as an image. Arch is the first backend; Debian is the second (see the
# README before using it).
#
#   perl scripts/mkosi_build.pl              # build the live image
#   perl scripts/mkosi_build.pl --dry-run    # show the command, build nothing
#
# The image is one artefact that serves as both the live USB and the installer:
# boot it, try JawnOS, and run `jawnos-install` to keep it.

[Config]
Profiles=live
Dependencies=

[Build]
# The post-install script fetches the Perl modules the app needs (there is no
# complete Arch package set for them), so the build needs the host network.
WithNetwork=yes

[Distribution]
Distribution=arch

[Output]
Format=disk
ImageId=jawnos
ImageVersion=0.1
OutputDirectory=output

[Content]
# The live root is read-only and every change lands in a RAM overlay, so a USB
# boot never rots. The house itself lives on the `jawnos-state` partition (see
# mkosi.repart/30-state.conf), which survives a reboot and is what the installer
# copies onto a disk.
Bootable=yes
# A single unified kernel image at EFI/BOOT/BOOTX64.EFI: the firmware's own
# fallback path, so the image boots in a VM or on a stick with no NVRAM entry
# and no separate systemd-boot menu to maintain.
Bootloader=uki
# quiet + splash turn the kernel's initialization list into the Plymouth splash
# (the JawnOS mark, built in the initramfs by the sd-plymouth hook). loglevel=3
# keeps genuine errors but drops the per-unit chatter. Ignore-serial-consoles
# matters in the VM and on a headless stick boot: mkosi attaches the console to
# hvc0, and without this Plymouth would paint its splash on the serial line
# instead of the DRM display.
KernelCommandLine=systemd.volatile=overlay systemd.firstboot=no quiet splash loglevel=3 plymouth.ignore-serial-consoles
Packages=
    base
    base-devel
    systemd
    systemd-ukify
    plymouth
    linux
    linux-firmware
    mkinitcpio
    sudo
    git
    perl
    cpanminus
    sqlite
    openssl
    curl
    rsync
    tmux
    less
    nano
    file
    which
    procps-ng
    iproute2
    iwd
    net-tools
    inetutils
    autossh
    openssh
    openvpn
    wireguard-tools
    sshpass
    argon2
    zip
    nodejs
    bluez
    bluez-utils
    pipewire
    wireplumber
    sway
    swaybg
    waybar
    foot
    fuzzel
    mako
    wl-clipboard
    grim
    slurp
    xdg-desktop-portal-wlr
    polkit
    mesa
    vulkan-intel
    intel-media-driver
    libva-utils
    webkit2gtk-4.1
    gst-plugins-base
    gst-plugins-good
    gst-plugins-bad
    gst-libav
    python
    python-gobject
    gtk-layer-shell
    python-dbus
    ffmpeg
    imagemagick
    tesseract
    espeak-ng
    sox
    zbar
    qrencode
    dosfstools
    mtools
    e2fsprogs
    parted
    efibootmgr

[Runtime]
# One command opens a GUI VM: `perl scripts/mkosi_build.pl --vm` (or mkosi's own
# `vm` verb) shows a GTK window with zoom-to-fit, and the guest boots Sway on a
# real DRM device. Do not pass --console=gui: mkosi's gui console adds
# `-display sdl,gl=on` and a PipeWire audio device. The audio can be made to
# start by handing root the session's pipewire socket, but the SDL GL path then
# gives the guest two DRM outputs and wlroots fails with "Failed to import
# source buffer into multi-GPU renderer" / "Backend commit failed", leaving
# Sway with no usable output at all.
#
# -vga std (bochs-drm) rather than -device virtio-vga: plain virtio-vga
# advertises no virgl (dmesg says `-virgl`), so its 3D path cannot be used. Both
# give Sway /dev/dri; std VGA is the simpler, better-tested one.
#
# 4G is the smallest RAM that kept the manager's worker set alive under QEMU
# (2G OOM-killed President.pl).
#
# Known limitation of this build host: after its first frames QEMU's graphic
# console stops presenting, so the guest screen (the waybar clock included)
# freezes even though Sway stays healthy -- swaymsg answers, new clients start,
# and a mode change forces exactly one fresh frame. That is where the manager
# screenshots come from. The guest itself is fine (vsock SSH, systemd, network,
# the manager all work); re-check the presentation stall on a desktop QEMU
# before treating the GUI path as shipped.
QemuArgs=-display gtk,zoom-to-fit=on -vga std
RAM=4G
