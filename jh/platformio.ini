; PlatformIO project for the JawnHat firmware (jh.ino, Seeed XIAO ESP32S3 Sense)
;
;   pio run                 build
;   pio run -t upload       flash over USB
;   pio device monitor      serial console
;
; A displayless peripheral: no panel, no LVGL, no TFT_eSPI (docs/hat.md).
; Libraries come from ~/jawnos-fw/deck-libs; the camera driver and the TFLM
; runtime are the platform's own prebuilt components.
;
[platformio]
; the sketch lives here, not in src/
src_dir = .

[env:hat]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino

; custom table: two 3 MB OTA slots and a 1.875 MB FFat (partitions.csv).
board_build.partitions = partitions.csv

build_src_filter =
	+<*.ino.cpp>
	-<build/>
	-<data/>
	-<.pio/>

lib_extra_dirs = /home/jawn/jawnos-fw/deck-libs
; deep: the shared micro_features front-end vendors its TensorFlow microfrontend
; a level down. The TFLM runtime is the platform's espressif__esp-tflite-micro.
lib_ldf_mode = deep

build_flags =
	-I.
	; firmware/house_ca.h: the house CA the manager's peer leaf is verified against
	-I../firmware
	; jt/hey_jawn_model.h is shared from the deck, not copied; phase 1 extracts it.
	-I../jt
	-DCORE_DEBUG_LEVEL=0

; The hat is a battery peripheral, not a computer: 80 MHz is the lowest clock at
; which the radio and the I2S DMA run cleanly, and the burst work (one camera
; frame, one TLS handshake, one spoken answer) does not need 240. The change that
; actually moves the clock is setCpuFrequencyMhz(80) in jh_02_setup.ino: the
; Arduino framework ships precompiled at the board's 240 MHz default, so a build
; flag alone would be a lie. Raise this if the phase-1 wake-word inference cannot
; keep real time.
board_build.f_cpu = 80000000L

upload_speed = 921600
monitor_speed = 115200

; JAWN_FW_VERSION: the house version is compiled in, so the board can report
; which build it is running (state_request and /device_query). The manager
; compares that with the image it has staged for the auto-OTA sweep.
extra_scripts = pre:../scripts/fw_version.py
