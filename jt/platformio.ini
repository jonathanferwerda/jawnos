; PlatformIO project for the JawnTeletype firmware (jt.ino, LilyGo T-Deck)
;
;   pio run                 build
;   pio run -t upload       flash over USB
;   pio device monitor      serial console
;
; The libraries come from ~/jawnos-fw/deck-libs: the same tree the arduino-cli
; builds were verified against (LVGL 9.6.0, TFT_eSPI with the T-Deck user setup,
; ESP32-audioI2S 4.0.0, TouchLib, es7210, RadioLib 7.8.1, ...).
;
[env:deck]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = tdeck
framework = arduino

; the sketch lives here, not in src/
src_dir = .
build_src_filter = +<*.ino> -<build/> -<data/>

lib_extra_dirs = /home/jawn/jawnos-fw/deck-libs

; lv_conf.h sits next to the sketch; make every compilation unit find it
build_flags =
	-DLV_CONF_INCLUDE_SIMPLE
	-I.

upload_speed = 921600
monitor_speed = 115200
