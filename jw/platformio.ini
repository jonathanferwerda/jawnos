; PlatformIO project for the JawnWatch firmware (jw.ino, LilyGo T-Watch S3)
;
;   pio run                 build
;   pio run -t upload       flash over USB
;   pio device monitor      serial console
;
; The libraries come from ~/jawnos-fw/watch-libs: the same tree the arduino-cli
; builds were verified against (LilyGoLib 0.3.0, LVGL 9.6.0, SensorLib 0.5.0,
; RadioLib 7.8.1, ESP8266Audio 2.4.1, ...). To move to managed libraries later,
; swap lib_extra_dirs for lib_deps entries.
;
[platformio]
; the sketch lives here, not in src/
src_dir = .

[env:watch]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = twatchs3
framework = arduino

build_src_filter =
	+<*.ino.cpp>
	-<build/>
	-<data/>
	-<.pio/>

lib_extra_dirs = /home/jawn/jawnos-fw/watch-libs

; the chain scan finds WiFi's own Network.h; deep is needed one more level so
; LilyGoLib's USB_MSC.cpp chain (LilyGoLib -> USB -> FS) resolves too
lib_ldf_mode = deep

; lv_conf.h sits next to the sketch; make every compilation unit find it
build_flags =
	-DLV_CONF_INCLUDE_SIMPLE
	-I.
	-DCORE_DEBUG_LEVEL=0

upload_speed = 921600
monitor_speed = 921600
