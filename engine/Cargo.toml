[package]
name = "jawn-audio"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "The JawnOS audio engine: a fixed-block graph and the session protocol, with a null device for machines without a sound card"
publish = false

[lib]
name = "jawn_audio"
path = "src/lib.rs"

[[bin]]
name = "jawn-audio"
path = "src/main.rs"

# Device backends are optional so the suite, and every machine that cannot
# build against ALSA or JACK, still gets the null device and the protocol.
# `--features alsa`, `--features jack`, or both, add the real hardware seam
# (docs/studio-audio-roadmap.md P1).
[features]
default = []
alsa = ["dep:alsa"]
jack = ["dep:jack"]

[dependencies]
alsa = { version = "0.9", optional = true }
jack = { version = "0.13", optional = true }
# The clock session's per-datagram tag. Pure Rust: no C dependency, and the
# engine still builds on a machine with no sound card (docs/studio-audio-roadmap.md P3).
hmac = "0.12"
sha2 = "0.10"
# The app voices live in their own crates so the DSP has tests of its own and
# no device: a synth patch and a drum kit are rendered by pure Rust, not by the
# browser (docs/studio-audio-roadmap.md P5).
jawn-synth = { path = "crates/jawn-synth" }
jawn-drums = { path = "crates/jawn-drums" }

# Its own workspace root: engine/ must build without dragging the repository's
# tree into a Cargo workspace. The app voices are members, so `cargo test
# --workspace` covers them and the engine binary links them when they are wired.
[workspace]
members = ["crates/jawn-synth", "crates/jawn-drums"]
